services:
  backend:
    build:
      context: ./Backend - Deployment
      dockerfile: Dockerfile
    container_name: caps-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:80"
    environment:
      APP_NAME: CAPS
      APP_ENV: local
      APP_KEY: "${APP_KEY:-base64:ZLpEYQ9IAUm182u5XLReAIXzHqiqLO3J+SlYFDkLi98=}"
      SOURCE_APP_KEY: "${SOURCE_APP_KEY:-}"
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${BACKEND_PORT:-8080}"
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${CAPS_DB_DATABASE:-arc_db}"
      DB_USERNAME: "${CAPS_DB_USERNAME:-caps_user}"
      DB_PASSWORD: "${CAPS_DB_PASSWORD:-caps_password}"
      CACHE_STORE: file
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      FILESYSTEM_DISK: public
      SANCTUM_STATEFUL_DOMAINS: "localhost:${FRONTEND_PORT:-3000},127.0.0.1:${FRONTEND_PORT:-3000},localhost:${BACKEND_PORT:-8080},127.0.0.1:${BACKEND_PORT:-8080}"
      FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-3000}"
    volumes:
      - caps-storage:/var/www/html/storage
      - caps-cache:/var/www/html/bootstrap/cache
    networks:
      - caps
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./Frontend - Deployment
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: "http://localhost:${BACKEND_PORT:-8080}/api"
    container_name: caps-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - caps
    depends_on:
      backend:
        condition: service_started

  mysql:
    image: mysql:8.0
    container_name: caps-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${CAPS_DB_ROOT_PASSWORD:-caps_root_password}"
      MYSQL_DATABASE: "${CAPS_DB_DATABASE:-arc_db}"
      MYSQL_USER: "${CAPS_DB_USERNAME:-caps_user}"
      MYSQL_PASSWORD: "${CAPS_DB_PASSWORD:-caps_password}"
    volumes:
      - caps-mysql:/var/lib/mysql
    networks:
      - caps
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  caps:
    driver: bridge

volumes:
  caps-mysql:
  caps-storage:
  caps-cache:
