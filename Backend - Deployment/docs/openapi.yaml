openapi: 3.0.3
info:
  title: CAPS API
  description: |
    HTTP API for the CAPS application (Laravel + Sanctum).
    See `docs/API.md` for narrative documentation, role matrices, and routing notes.

    **Base path:** Laravel registers `routes/api.php` under `/api` by default.

    **Duplicate routes:** `GET /quiz-results` and `GET /quiz-results/{id}` are registered for both
    faculty (roles 2–5) and students (role 1); Laravel matches the faculty registration first.
  version: 2.0.0

servers:
  - url: /api
    description: API prefix (typical Laravel default)

tags:
  - name: Public
  - name: Authenticated
  - name: FacultyStaff
    description: roles 2,3,4,5 + TokenExpirationMiddleware
  - name: Student
    description: role 1
  - name: ProgramChair
    description: role 3 only
  - name: ChairDean
    description: roles 3,4,5
  - name: Dean
    description: roles 4,5
  - name: StaticFiles

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token

security:
  - bearerAuth: []

paths:
  /register:
    post:
      tags: [Public]
      summary: Register user
      security: []
  /login:
    post:
      tags: [Public]
      summary: Login
      security: []
  /roles:
    get:
      tags: [Public]
      summary: List available roles
      security: []
  /campuses:
    get:
      tags: [Public]
      summary: List all campuses
      security: []
    post:
      tags: [Dean]
      summary: Create a campus (Dean only)
  /forgot-password:
    post:
      tags: [Public]
      summary: Request password reset email
      security: []
  /reset-password:
    post:
      tags: [Public]
      summary: Reset password with token
      security: []
  /app-version:
    get:
      tags: [Public]
      summary: Application version
      security: []

  /change-password:
